name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          ./scripts/release-notes.sh "${VERSION}" > release-notes.md
      - name: Install DMG packager
        run: brew install create-dmg
      - name: Test
        run: make test
      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}"
          make release-artifacts CONFIGURATION=release VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" CREATE_DMG_FINALIZE_FLAGS=''
      # macOS gives an app the current appearance only when its executable
      # records an SDK of 26.0 or newer. The block is a gate: a release that
      # records an older SDK must not be published.
      - name: Check the recorded SDK
        run: |
          vtool -show-build "dist/Wallpaper Selector.app/Contents/MacOS/WallpaperSelector" | grep -q "sdk 27.2"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            release/*.dmg
            release/*.sha256
