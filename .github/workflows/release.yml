name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish the release
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' -print 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::no Xcode 27 installation on this runner"
            ls /Applications
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $sdk"
          case "$sdk" in
            27.2) ;;
            *) echo "::error::Package.swift stamps the macOS 27.2 SDK, but this runner has $sdk"; exit 1 ;;
          esac

      - name: Resolve the version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::the version \"$version\" is not valid"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The tag must sit on the default branch
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::the tag ${GITHUB_REF_NAME} is not on origin/main; cut it from the default branch"
            exit 1
          fi

      - name: Install the DMG packager
        run: brew install create-dmg

      - name: Run the test suite
        run: make test

      - name: Build the release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: make release-artifacts CONFIGURATION=release VERSION="$VERSION" \
          BUILD_NUMBER="$BUILD_NUMBER" CREATE_DMG_FINALIZE_FLAGS=''

      - name: Verify the built bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make verify VERSION="$VERSION"

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/changelog.sh notes "$VERSION" > release-notes.md
          {
            echo ""
            echo "## Checksums"
            echo ""
            echo '```'
            cat release/*.sha256
            echo '```'
          } >> release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Wallpaper Selector ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*.dmg
            release/*.sha256
          fail_on_unmatched_files: true
