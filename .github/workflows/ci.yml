name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make test
      - name: Build release app
        run: make bundle CONFIGURATION=release
      # The DMG and the checksum are only built on a release tag, so a broken
      # create-dmg flag, a broken hdiutil convert or a wrong checksum name
      # would only be found at release time. This step runs the same recipe
      # on every push.
      # The step is NOT a gate: an environment-specific create-dmg or Finder
      # failure on the runner must never turn CI red, so the step reports
      # early signal only.
      - name: Build release artifacts
        continue-on-error: true
        env:
          VERSION: 0.0.0-ci
          BUILD_NUMBER: 0
        run: |
          brew install create-dmg
          make release-artifacts CONFIGURATION=release VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" CREATE_DMG_FINALIZE_FLAGS=''
      # The `hdiutil convert` branch of the DMG recipe only runs when
      # CREATE_DMG_FINALIZE_FLAGS is not empty. The step above passes an
      # empty value on purpose, so the branch would never run in CI.
      # This step runs the recipe with the default flags, so the branch runs.
      # The version and the build number are different from the step above,
      # so the two steps cannot write the same artifact names.
      # The step is NOT a gate: it is a signal that the conversion still
      # works, so a failure must never turn CI red.
      - name: Build release artifacts with the default finalize flags
        continue-on-error: true
        env:
          VERSION: 0.0.0-ci-convert
          BUILD_NUMBER: 1
        run: |
          brew install create-dmg
          make release-artifacts CONFIGURATION=release VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER"
